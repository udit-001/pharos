name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # required for cosign keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Classic PAT (public_repo scope) used to push manifests to the
      # udit-001/winget-pkgs fork and open PRs against microsoft/winget-pkgs.
      # Lifted into env so steps can branch on its presence (the secrets
      # context cannot be read from an `if:` condition).
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # GoReleaser needs full git history for changelog

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the Windows binaries to WinGet. Releases created by GoReleaser
      # with GITHUB_TOKEN do not trigger `release: published` workflows, so the
      # submission must run in the release job's own graph. Guarded to stable
      # tag pushes only: goreleaser's `prerelease: auto` treats any `-` in the
      # tag as a prerelease, and winget-pkgs rejects prerelease versions.
      - name: Publish to WinGet
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: udit-001.Pharos
          installers-regex: '\.exe$'  # raw pharos_<ver>_windows_<arch>.exe assets
          release-tag: ${{ github.ref_name }}
          token: ${{ env.WINGET_TOKEN }}

      - name: Explain skipped WinGet submission
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && env.WINGET_TOKEN == ''
        run: |
          {
          echo "WINGET_TOKEN is not set, so no winget-pkgs pull request was opened."
          echo ""
          echo "To enable it, once:"
          echo "1. The winget-pkgs fork must live on this repo's owner account (udit-001/winget-pkgs exists)."
          echo "2. Create a classic PAT with the \`public_repo\` scope on that account."
          echo "3. Store it as the WINGET_TOKEN repository secret."
          echo ""
          echo "Submissions can also be made by hand with \`wingetcreate submit\` pointing"
          echo "at a directory holding the three manifest files."
          } >> "$GITHUB_STEP_SUMMARY"
