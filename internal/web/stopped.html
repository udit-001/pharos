<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharos — Not Running</title>
<script>(function(){var t=localStorage.getItem('pharos_theme');if(!t||t==='system'){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t})()</script>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --text: #2e3440;
    --slate-400: #94a3b8;
    --slate-500: #64748b;
    --slate-100: #f1f5f9;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #2e3440;
    --text: #eceff4;
    --slate-400: #94adcb;
    --slate-500: #88c0d0;
    --slate-100: #434c5e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .container {
    display: flex;
    flex-direction: column;
    padding: 0 1rem;
    min-height: 100dvh;
  }
  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .content {
    text-align: center;
    max-width: 28rem;
  }
  .logo { width: 28px; height: 28px; margin: 0 auto 1.5rem; display: block; color: var(--text); }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.025em;
    margin-bottom: 0.125rem;
  }
  .subtitle {
    font-size: 0.875rem;
    color: var(--slate-500);
    line-height: 1.625;
    margin-bottom: 0.75rem;
  }
  code {
    display: inline-block;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 0.875rem;
    background: var(--slate-100);
    border-radius: 0.5rem;
    padding: 0.625rem 1rem;
    margin-bottom: 2rem;
  }
  .actions { display: flex; align-items: center; justify-content: center; gap: 1rem; }
  button {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    font-size: 0.75rem;
    color: var(--slate-400);
    background: none;
    border: none;
    cursor: pointer;
    transition: color 0.15s;
  }
  button:hover { color: var(--text); }
  .footer {
    text-align: center;
    padding-bottom: 1.5rem;
    font-size: 0.75rem;
    color: var(--slate-400);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="main">
      <div class="content">
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">
            <line x1="50" y1="50" x2="28" y2="28"/>
            <line x1="50" y1="50" x2="74" y2="30"/>
            <line x1="50" y1="50" x2="26" y2="70"/>
            <line x1="50" y1="50" x2="74" y2="72"/>
          </g>
          <g fill="currentColor">
            <circle cx="28" cy="28" r="4"/>
            <circle cx="74" cy="30" r="4"/>
            <circle cx="26" cy="70" r="4"/>
            <circle cx="74" cy="72" r="4"/>
          </g>
          <circle cx="50" cy="50" r="8" fill="currentColor"/>
        </svg>
        <h1>Pharos isn't running</h1>
        <p class="subtitle">Start it from your terminal:</p>
        <code>pharos start</code>
        <div class="actions">
          <button onclick="window.location.reload()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            <span>Retry</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function() {
      if (localStorage.getItem('pharos_theme') === 'system' || !localStorage.getItem('pharos_theme')) {
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      }
    });
  </script>
</body>
</html>
